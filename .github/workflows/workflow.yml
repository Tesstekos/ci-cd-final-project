# GitHub URL: https://github.com/Tesstekos/ci-cd-final-project/blob/main/.github/workflows/workflow.yml
# Repository: https://github.com/Tesstekos/ci-cd-final-project
# CI workflow steps: Checkout, Install dependencies,
#   Lint with flake8 (flake8 service --count ...),
#   Run unit tests with nose (nosetests -v --with-spec --spec-color --with-coverage --cover-package=app)
name: CI workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nose
        run: nosetests -v --with-spec --spec-color --with-coverage --cover-package=app
